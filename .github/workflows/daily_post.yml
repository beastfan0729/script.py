name: Daily YouTube Auto Post

on:
  schedule:
    - cron: '0 0 * * *' # Har raat midnight par chalega
  workflow_dispatch: # Manual trigger ke liye

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Deno runtime add karein taaki yt-dlp YouTube JS challenge pass kar sake
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Auto-Upload Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python script.py
