name: Daily YouTube Auto Post

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
            echo "YouTube cookies loaded from secret."
          else
            echo "No YOUTUBE_COOKIES secret found. yt-dlp may still fail YouTube bot checks."
          fi

      - name: Run Auto-Upload Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python script.py
